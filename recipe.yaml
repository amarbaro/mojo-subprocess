# rattler-build recipe, modular-community shape.
# Build locally: rattler-build build -r recipe.yaml -c https://conda.modular.com/max -c conda-forge
context:
  version: 0.1.0

package:
  name: "mojo-subprocess"
  version: ${{ version }}

source:
  - path: .

build:
  number: 0
  script:
    - mojo precompile src/subprocess -I ${{ PREFIX }}/lib/mojo -o ${{ PREFIX }}/lib/mojo/subprocess.mojoc

requirements:
  host:
    - mojo-compiler >=1.2.0,<1.3
    - mojo-posix >=0.1.0,<0.2
  build:
    - mojo-compiler >=1.2.0,<1.3
  run:
    - ${{ pin_compatible('mojo-compiler') }}
    - mojo-posix >=0.1.0,<0.2

tests:
  - script:
    - if: unix
      then:
        - mojo build -I src examples/quickstart.mojo -o quickstart
    files:
      source:
        - src/
        - examples/

about:
  homepage: https://github.com/amarbaro/mojo-subprocess
  license: Apache-2.0
  license_file: LICENSE
  summary: subprocess.run for Mojo
  repository: https://github.com/amarbaro/mojo-subprocess

extra:
  maintainers:
    - amarbaro.org
  project_name:
    - mojo-subprocess
