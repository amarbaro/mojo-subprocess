[project]
name = "mojo-subprocess"
version = "0.1.1"
description = "subprocess.run for Mojo: capture stdout/stderr, input, timeout, cwd/env, same results as Python"
license = "Apache-2.0"
requires-python = ">=3.11,<3.15"
dependencies = ["mojo>=1.2.0,<1.3"]

[project.urls]
Homepage = "https://github.com/amarbaro/mojo-subprocess"
Repository = "https://github.com/amarbaro/mojo-subprocess"

[tool.mojo]
packages = ["subprocess"]  # src/posix is a vendored copy of mojo-posix for a clone build
deps = ["mojo-posix >=0.1.0,<0.2"]
